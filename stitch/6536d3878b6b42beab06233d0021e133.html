<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop overflow-hidden relative font-body-md">
<!-- Glitchy Background Layer -->
<div aria-hidden="true" class="absolute inset-0 z-0 opacity-20 pointer-events-none flex flex-wrap gap-gutter p-gutter content-start justify-center">
<!-- Faux grid nodes -->
<div class="w-16 h-16 border border-primary bg-primary/10"></div>
<div class="w-16 h-16 border border-outline-variant"></div>
<div class="w-16 h-16 border border-outline-variant"></div>
<div class="w-16 h-16 border border-primary bg-primary/5"></div>
<div class="w-16 h-16 border border-outline-variant"></div>
<div class="w-16 h-16 border border-outline-variant translate-y-2 translate-x-1"></div>
<div class="w-16 h-16 border border-primary bg-primary/20"></div>
<div class="w-16 h-16 border border-outline-variant"></div>
<div class="w-16 h-16 border border-outline-variant"></div>

<div class="w-16 h-16 border border-primary bg-primary/5"></div>

</div>
<!-- Main Result Panel -->
<main class="relative z-10 w-full max-w-[600px] bg-surface border border-outline-variant shadow-[0_0_30px_rgba(75,226,119,0.05)] p-6 md:p-10 flex flex-col items-center text-center">
<!-- Status Indicator -->
<div class="w-16 h-16 rounded-full border-2 border-primary bg-primary/10 flex items-center justify-center mb-6 shadow-[0_0_15px_rgba(75,226,119,0.2)]">
<span class="material-symbols-outlined text-primary text-[32px]">check_circle</span>
</div>
<!-- Headline -->
<h1 class="text-primary text-headline-lg font-headline-lg uppercase tracking-widest mb-2">
            System Restored
        </h1>
<p class="text-on-surface-variant text-body-md font-body-md mb-8">
            Signal integrity stabilized across all sectors.
        </p>
<!-- High Score Chip -->
<div class="bg-tertiary-container border border-tertiary text-on-tertiary-container font-label-sm text-label-sm px-4 py-1 rounded-full uppercase tracking-widest mb-8 flex items-center gap-2">
<span class="material-symbols-outlined text-[16px]">stars</span>
            New High Score!
        </div>
<!-- Stats Bento Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-unit w-full mb-10">
<!-- Score Block (Full Width) -->
<div class="md:col-span-2 bg-surface-container border border-outline-variant p-6 flex flex-col items-center justify-center">
<span class="text-on-surface-variant text-label-sm font-label-sm uppercase tracking-widest mb-2">Final Score</span>
<span class="text-on-surface text-headline-lg font-data-lg text-[40px] leading-none text-primary-fixed">4,800</span>
</div>
<!-- Time Block -->
<div class="bg-surface-container border border-outline-variant p-4 flex flex-col items-center justify-center">
<span class="text-on-surface-variant text-label-sm font-label-sm uppercase tracking-widest mb-1 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">schedule</span> Time
                </span>
<span class="text-on-surface text-data-lg font-data-lg">05:12</span>
</div>
<!-- Nodes Block -->
<div class="bg-surface-container border border-outline-variant p-4 flex flex-col items-center justify-center">
<span class="text-on-surface-variant text-label-sm font-label-sm uppercase tracking-widest mb-1 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">hub</span> Nodes Connected
                </span>
<span class="text-on-surface text-data-lg font-data-lg">64</span>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col md:flex-row w-full gap-4">
<button class="flex-1 h-touch-target-min bg-surface border border-outline-variant text-on-surface font-label-sm text-label-sm uppercase tracking-widest hover:bg-surface-container hover:border-outline transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]">menu</span>
                Main Menu
            </button>
<button class="flex-1 h-touch-target-min bg-primary text-on-primary font-label-sm text-label-sm uppercase tracking-widest hover:bg-primary-fixed transition-colors border border-transparent hover:border-primary-fixed flex items-center justify-center gap-2 shadow-[0_0_10px_rgba(75,226,119,0.3)]">
<span class="material-symbols-outlined text-[18px]">replay</span>
                Play Again
            </button>
