<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pulse Grid - Main Menu</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=JetBrains+Mono:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-bright": "#31394d",
                        "surface-container-highest": "#2d3449",
                        "primary-fixed": "#6bff8f",
                        "on-tertiary-fixed": "#2a1700",
                        "surface": "#0b1326",
                        "surface-container-high": "#222a3d",
                        "primary": "#4be277",
                        "tertiary-fixed": "#ffddb8",
                        "surface-dim": "#0b1326",
                        "on-primary-fixed": "#002109",
                        "surface-container-lowest": "#060e20",
                        "on-primary": "#003915",
                        "secondary-container": "#b50036",
                        "tertiary-fixed-dim": "#ffb95f",
                        "surface-container": "#171f33",
                        "inverse-primary": "#006e2f",
                        "background": "#0b1326",
                        "secondary-fixed": "#ffdadb",
                        "secondary": "#ffb2b7",
                        "surface-tint": "#4ae176",
                        "outline-variant": "#3d4a3d",
                        "on-secondary-fixed-variant": "#92002a",
                        "on-secondary-fixed": "#40000d",
                        "inverse-on-surface": "#283044",
                        "secondary-fixed-dim": "#ffb2b7",
                        "tertiary-container": "#ef9900",
                        "on-error": "#690005",
                        "on-tertiary": "#472a00",
                        "tertiary": "#ffba61",
                        "on-error-container": "#ffdad6",
                        "surface-container-low": "#131b2e",
                        "primary-fixed-dim": "#4ae176",
                        "on-tertiary-fixed-variant": "#653e00",
                        "error-container": "#93000a",
                        "on-primary-fixed-variant": "#005321",
                        "on-tertiary-container": "#5c3800",
                        "error": "#ffb4ab",
                        "on-primary-container": "#004b1e",
                        "on-secondary-container": "#ffc2c4",
                        "inverse-surface": "#dae2fd",
                        "on-surface": "#dae2fd",
                        "on-background": "#dae2fd",
                        "surface-variant": "#2d3449",
                        "on-surface-variant": "#bccbb9",
                        "primary-container": "#22c55e",
                        "outline": "#869585",
                        "on-secondary": "#67001b"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin-desktop": "32px",
                        "unit": "4px",
                        "touch-target-min": "44px",
                        "margin-mobile": "16px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "data-lg": ["JetBrains Mono"],
                        "body-lg": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"],
                        "label-sm": ["JetBrains Mono"],
                        "headline-md": ["Hanken Grotesk"],
                        "data-md": ["JetBrains Mono"],
                        "headline-lg": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "data-lg": ["24px", { "lineHeight": "24px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "data-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .signal-glow {
            box-shadow: 0 0 16px -4px theme('colors.primary');
        }
        .text-glow {
            text-shadow: 0 0 12px theme('colors.primary-fixed-dim');
        }
        .bg-grid-pattern {
            background-size: 32px 32px;
            background-image: 
                linear-gradient(to right, theme('colors.surface-container-high') 1px, transparent 1px),
                linear-gradient(to bottom, theme('colors.surface-container-high') 1px, transparent 1px);
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col font-body-md overflow-hidden relative selection:bg-primary-container selection:text-on-primary-container">
<!-- Background Grid (Blurred) -->
<div class="absolute inset-0 bg-grid-pattern opacity-30 z-0 filter blur-sm"></div>
<div class="absolute inset-0 bg-gradient-to-b from-surface/80 via-background/90 to-surface/80 z-0"></div>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center relative z-10 px-margin-mobile md:px-margin-desktop w-full max-w-lg mx-auto h-full">
<!-- Brand Logo Area -->
<div class="mb-12 text-center w-full">
<h1 class="text-headline-lg font-headline-lg text-primary text-glow uppercase tracking-widest flex flex-col items-center gap-4">
<span class="material-symbols-outlined text-[64px]" data-icon="hub">hub</span>
                PULSE_GRID
            </h1>
<p class="text-data-md font-data-md text-on-surface-variant mt-2 uppercase tracking-widest">Signal Routing Protocol</p>
</div>
<!-- Menu Container -->
<div class="w-full bg-surface-container border border-outline-variant p-6 flex flex-col gap-unit">
<!-- Resume Game (Active state example) -->
<button class="h-touch-target-min w-full flex items-center justify-between px-4 border border-outline-variant bg-surface hover:bg-primary hover:text-surface hover:border-primary transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background group">
<span class="text-data-md font-data-md uppercase tracking-wider group-hover:text-surface">Resume Game</span>
<span class="material-symbols-outlined group-hover:text-surface text-primary" data-icon="play_arrow">play_arrow</span>
</button>
<!-- Start New Game -->
<button class="h-touch-target-min w-full flex items-center justify-between px-4 border border-outline-variant bg-surface hover:bg-primary hover:text-surface hover:border-primary transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background group">
<span class="text-data-md font-data-md uppercase tracking-wider group-hover:text-surface">Start New Game</span>
<span class="material-symbols-outlined group-hover:text-surface text-on-surface-variant" data-icon="add">add</span>
</button>
<!-- Difficulty Selection (Nested/Tabs) -->
<div class="w-full border border-outline-variant bg-surface-container-low mt-4 flex flex-col">
<div class="px-4 py-2 border-b border-outline-variant text-label-sm font-label-sm text-on-surface-variant uppercase tracking-widest">
                    Select Difficulty
                </div>
<div class="flex w-full">
<button class="flex-1 h-touch-target-min flex items-center justify-center border-r border-outline-variant bg-surface hover:bg-surface-bright text-data-md font-data-md focus:outline-none focus:bg-surface-bright focus:text-primary transition-colors">
                        Easy
                    </button>
<button class="flex-1 h-touch-target-min flex items-center justify-center border-r border-outline-variant bg-surface-container-highest text-primary font-bold signal-glow border border-primary z-10 text-data-md font-data-md focus:outline-none transition-colors">
                        Medium
                    </button>
<button class="flex-1 h-touch-target-min flex items-center justify-center bg-surface hover:bg-surface-bright text-data-md font-data-md focus:outline-none focus:bg-surface-bright focus:text-primary transition-colors">
                        Hard
                    </button>
</div>
</div>
<!-- Quit -->
<button class="h-touch-target-min w-full flex items-center justify-between px-4 border border-outline-variant bg-surface hover:bg-error hover:text-on-error hover:border-error transition-colors mt-4 focus:outline-none focus:ring-2 focus:ring-error focus:ring-offset-2 focus:ring-offset-background group">
<span class="text-data-md font-data-md uppercase tracking-wider group-hover:text-on-error">Quit System</span>
<span class="material-symbols-outlined group-hover:text-on-error text-on-surface-variant" data-icon="power_settings_new">power_settings_new</span>
</button>
</div>
</main>
<!-- Small Footer -->
<footer class="w-full p-4 flex justify-between items-center text-label-sm font-label-sm text-on-surface-variant z-10 absolute bottom-0">
<span class="uppercase">v2.4.1.09</span>
<a class="hover:text-primary transition-colors uppercase flex items-center gap-1 focus:outline-none focus:text-primary" href="#">
<span class="material-symbols-outlined text-[16px]" data-icon="help">help</span>
            Help
        </a>
</footer>
</body></html>
